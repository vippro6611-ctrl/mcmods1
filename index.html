<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Addon & Mod Manager</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --border: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding-bottom: 40px; }

    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { font-size: 1.4rem; font-weight: bold; color: var(--accent); }
    .nav-actions { display: flex; gap: 12px; align-items: center; }

    .btn {
      background-color: var(--accent); color: white; border: none;
      padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background-color: var(--accent-hover); }

    .btn-danger { background-color: var(--danger); }
    .btn-danger:hover { background-color: var(--danger-hover); }
    .btn-secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
    .btn-secondary:hover { background-color: var(--bg-card); }

    .filter-container {
      max-width: 1200px; margin: 20px auto; padding: 0 20px;
      display: flex; gap: 12px; flex-wrap: wrap;
    }

    .search-input, .select-input {
      background-color: var(--bg-secondary); border: 1px solid var(--border);
      color: var(--text-main); padding: 0.6rem 1rem; border-radius: 6px; outline: none;
    }
    .search-input { flex: 1; min-width: 200px; }

    .addon-grid {
      max-width: 1200px; margin: 0 auto; padding: 0 20px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
    }

    .addon-card {
      background-color: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
    }
    .addon-card img { width: 100%; height: 160px; object-fit: cover; background-color: var(--bg-card); }
    .addon-card-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
    .addon-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
    .addon-author { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    
    /* Mô tả Addon */
    .addon-desc {
      font-size: 0.88rem;
      color: #cbd5e1;
      margin-bottom: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tag { font-size: 0.75rem; background-color: var(--bg-card); padding: 2px 8px; border-radius: 4px; color: var(--accent); }

    .addon-card-footer { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; align-items: center; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background-color: var(--bg-secondary); border: 1px solid var(--border);
      width: 90%; max-width: 500px; border-radius: 10px; padding: 24px; max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-muted); }
    .form-control { width: 100%; background-color: var(--bg-primary); border: 1px solid var(--border); color: var(--text-main); padding: 0.6rem 0.8rem; border-radius: 6px; outline: none; }
    textarea.form-control { resize: vertical; min-height: 80px; }
    
    .preview-box { margin-top: 10px; display: none; }
    .preview-box img { max-width: 100%; max-height: 180px; border-radius: 6px; border: 1px solid var(--border); }

    .auth-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border); }
    .auth-tab { padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; }
    .auth-tab.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ Bedrock Addons</div>
    <div class="nav-actions">
      <button class="btn" id="openUploadBtn">+ Upload Addon</button>
      <div id="authSection">
        <button class="btn btn-secondary" id="openAuthBtn">Sign In / Register</button>
      </div>
    </div>
  </header>

  <div class="filter-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm Addon/Mod...">
    <select id="categoryFilter" class="select-input">
      <option value="All">Tất cả danh mục</option>
      <option value="MY_UPLOADS">📌 Addon đã đăng của tôi</option>
      <option value="Bedrock Addon">Bedrock Addon</option>
      <option value="Java Mod">Java Mod</option>
      <option value="Texture Pack">Texture Pack</option>
    </select>
  </div>

  <main class="addon-grid" id="addonGrid"></main>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Upload Addon / Mod</h3>
        <button class="close-btn" id="closeUploadModal">&times;</button>
      </div>
      <form id="uploadForm">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="addonTitle" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="addonCategory" class="form-control">
            <option value="Bedrock Addon">Bedrock Addon</option>
            <option value="Java Mod">Java Mod</option>
            <option value="Texture Pack">Texture Pack</option>
          </select>
        </div>
        <div class="form-group">
          <label>Description / Mô tả *</label>
          <textarea id="addonDescription" class="form-control" placeholder="Nhập mô tả chi tiết về Addon của bạn..." required></textarea>
        </div>
        <div class="form-group">
          <label>Thumbnail Image *</label>
          <input type="file" id="thumbnailInput" class="form-control" accept="image/*" required>
          <div class="preview-box" id="previewBox">
            <img id="imagePreview" src="#" alt="Preview">
          </div>
        </div>
        <div class="form-group">
          <label>Addon File (.mcaddon, .mcpack, .zip) *</label>
          <input type="file" id="addonFileInput" class="form-control" accept=".mcaddon,.mcpack,.zip" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Publish</button>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="authModalTitle">Tài khoản</h3>
        <button class="close-btn" id="closeAuthModal">&times;</button>
      </div>
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin">Đăng nhập</div>
        <div class="auth-tab" id="tabRegister">Đăng ký</div>
      </div>
      <form id="authForm">
        <div class="form-group">
          <label>Tên người dùng</label>
          <input type="text" id="authUsername" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="authPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn" id="authSubmitBtn" style="width: 100%;">Đăng nhập</button>
      </form>
    </div>
  </div>

  <script>
    // --- 1. IndexedDB Core ---
    const DB_NAME = 'MinecraftAddonDB';
    const DB_VERSION = 1;
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains('files')) {
            dbInstance.createObjectStore('files');
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function saveFileToDB(id, fileBlob) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        const store = tx.objectStore('files');
        const req = store.put(fileBlob, id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function getFileFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readonly');
        const store = tx.objectStore('files');
        const req = store.get(id);
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function deleteFileFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        const store = tx.objectStore('files');
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    // --- 2. Auth & State ---
    let currentUser = localStorage.getItem('currentUser') || null;
    let addons = JSON.parse(localStorage.getItem('addonsList')) || [];

    const authSection = document.getElementById('authSection');
    const authModal = document.getElementById('authModal');
    const uploadModal = document.getElementById('uploadModal');
    const addonGrid = document.getElementById('addonGrid');
    const categoryFilter = document.getElementById('categoryFilter');
    const searchInput = document.getElementById('searchInput');

    function updateAuthUI() {
      if (currentUser) {
        authSection.innerHTML = `
          <span style="color: var(--text-muted); font-size: 0.9rem;">👋 ${currentUser}</span>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        `;
      } else {
        authSection.innerHTML = `<button class="btn btn-secondary" id="openAuthBtn" onclick="openAuthView()">Sign In / Register</button>`;
      }
      renderAddons();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('currentUser');
      updateAuthUI();
    }

    function openAuthView() { authModal.style.display = 'flex'; }

    // --- 3. Preview Image Handler ---
    const thumbnailInput = document.getElementById('thumbnailInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewBox = document.getElementById('previewBox');

    thumbnailInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        imagePreview.src = URL.createObjectURL(file);
        previewBox.style.display = 'block';
      } else {
        previewBox.style.display = 'none';
      }
    });

    // --- 4. Upload Form Submit ---
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!currentUser) {
        alert("Bạn cần đăng nhập để có thể upload bài!");
        openAuthView();
        return;
      }

      const title = document.getElementById('addonTitle').value;
      const category = document.getElementById('addonCategory').value;
      const description = document.getElementById('addonDescription').value;
      const imageFile = thumbnailInput.files[0];
      const addonFile = document.getElementById('addonFileInput').files[0];

      if (!imageFile || !addonFile) {
        alert("Vui lòng chọn đầy đủ ảnh và file addon!");
        return;
      }

      const fileId = 'file_' + Date.now();
      await saveFileToDB(fileId, addonFile);

      const reader = new FileReader();
      reader.onload = function(event) {
        const newAddon = {
          id: fileId,
          title: title,
          category: category,
          description: description,
          author: currentUser,
          image: event.target.result,
          fileName: addonFile.name
        };

        addons.unshift(newAddon);
        localStorage.setItem('addonsList', JSON.stringify(addons));
        renderAddons();
        uploadModal.style.display = 'none';
        document.getElementById('uploadForm').reset();
        previewBox.style.display = 'none';
      };
      reader.readAsDataURL(imageFile);
    });

    // --- 5. Download & Delete Handlers ---
    async function downloadAddon(id, fileName) {
      try {
        const fileBlobData = await getFileFromDB(id);
        if (!fileBlobData) {
          alert('Không tìm thấy dữ liệu tệp!');
          return;
        }

        const blob = new Blob([fileBlobData], { type: 'application/zip' });
        const downloadUrl = URL.createObjectURL(blob);
        const downloadLink = document.createElement('a');

        downloadLink.href = downloadUrl;
        downloadLink.download = fileName;

        document.body.appendChild(downloadLink);
        downloadLink.click();

        setTimeout(() => {
          document.body.removeChild(downloadLink);
          URL.revokeObjectURL(downloadUrl);
        }, 200);
      } catch (err) {
        alert('Lỗi tải tệp: ' + err.message);
      }
    }

    async function deleteAddon(id) {
      if (!confirm("Bạn có chắc chắn muốn xóa Addon này không?")) return;
      
      addons = addons.filter(item => item.id !== id);
      localStorage.setItem('addonsList', JSON.stringify(addons));
      await deleteFileFromDB(id);
      renderAddons();
    }

    // --- 6. Render Addons ---
    function renderAddons() {
      addonGrid.innerHTML = '';
      const selectedCategory = categoryFilter.value;
      const searchText = searchInput.value.toLowerCase().trim();

      let filtered = addons.filter(item => {
        const matchSearch = item.title.toLowerCase().includes(searchText) || 
                            item.author.toLowerCase().includes(searchText) ||
                            (item.description && item.description.toLowerCase().includes(searchText));
        
        if (selectedCategory === 'MY_UPLOADS') {
          return matchSearch && (currentUser && item.author === currentUser);
        } else if (selectedCategory !== 'All') {
          return matchSearch && item.category === selectedCategory;
        }
        return matchSearch;
      });

      if (filtered.length === 0) {
        addonGrid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px 0;">
          ${selectedCategory === 'MY_UPLOADS' ? 'Bạn chưa đăng Addon nào.' : 'Không tìm thấy Addon phù hợp.'}
        </p>`;
        return;
      }

      filtered.forEach(item => {
        const isOwner = currentUser && item.author === currentUser;
        const card = document.createElement('div');
        card.className = 'addon-card';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}">
          <div class="addon-card-body">
            <div class="addon-title">${item.title}</div>
            <div class="addon-author">Tác giả: ${item.author}</div>
            <div class="addon-desc">${item.description || 'Không có mô tả.'}</div>
            <div style="margin-bottom: 12px;">
              <span class="tag">${item.category}</span>
            </div>
            <div class="addon-card-footer">
              <button class="btn" onclick="downloadAddon('${item.id}', '${item.fileName}')">Download</button>
              ${isOwner ? `<button class="btn btn-danger" onclick="deleteAddon('${item.id}')">Xóa</button>` : ''}
            </div>
          </div>
        `;
        addonGrid.appendChild(card);
      });
    }

    categoryFilter.addEventListener('change', renderAddons);
    searchInput.addEventListener('input', renderAddons);

    document.getElementById('openUploadBtn').onclick = () => {
      if (!currentUser) {
        alert("Bạn cần đăng nhập trước khi Upload!");
        openAuthView();
        return;
      }
      uploadModal.style.display = 'flex';
    };
    document.getElementById('closeUploadModal').onclick = () => uploadModal.style.display = 'none';
    document.getElementById('closeAuthModal').onclick = () => authModal.style.display = 'none';

    document.getElementById('tabLogin').onclick = function() {
      this.classList.add('active');
      document.getElementById('tabRegister').classList.remove('active');
      document.getElementById('authSubmitBtn').innerText = 'Đăng nhập';
    };

    document.getElementById('tabRegister').onclick = function() {
      this.classList.add('active');
      document.getElementById('tabLogin').classList.remove('active');
      document.getElementById('authSubmitBtn').innerText = 'Đăng ký';
    };

    document.getElementById('authForm').onsubmit = (e) => {
      e.preventDefault();
      const user = document.getElementById('authUsername').value;
      if (user) {
        currentUser = user;
        localStorage.setItem('currentUser', currentUser);
        updateAuthUI();
        authModal.style.display = 'none';
      }
    };

    initDB().then(() => {
      updateAuthUI();
    });
  </script>
</body>
</html>
