<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftVault - Minecraft Mods & Addons</title>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: { 900: '#070a0f', 800: '#0d1117', 700: '#161b22', 600: '#21262d' },
                        mc: { emerald: '#10b981', diamond: '#06b6d4', gold: '#f59e0b', redstone: '#ef4444' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], pixel: ['"Press Start 2P"', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        .glass-panel { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(22, 27, 34, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.2s; }
        .glass-card:hover { border-color: #10b981; transform: translateY(-3px); }
    </style>
</head>
<body class="bg-obsidian-900 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 glass-panel border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-mc-emerald flex items-center justify-center text-obsidian-900 font-pixel">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <span class="font-pixel text-sm bg-gradient-to-r from-emerald-400 to-mc-diamond bg-clip-text text-transparent">CRAFTVAULT</span>
            </a>
            <div class="flex items-center gap-3">
                <button onclick="openUploadModal()" class="px-4 py-2 rounded-xl bg-mc-emerald text-obsidian-900 font-bold text-xs flex items-center gap-2 hover:bg-emerald-400 transition-all shadow-lg">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Tải Lên Mod / Addon
                </button>
            </div>
        </div>
    </header>

    <!-- CATALOG MAIN -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-boxes-stacked text-mc-emerald mr-2"></i>Danh sách Addons Kho Tệp</h2>
            <button onclick="clearDatabase()" class="px-3 py-1.5 rounded-lg bg-red-950/60 border border-mc-redstone/40 text-mc-redstone text-xs hover:bg-red-900/80">
                <i class="fa-solid fa-trash mr-1"></i> Xóa dữ liệu cũ
            </button>
        </div>

        <div id="mods-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <div id="loading-state" class="text-center py-12 text-gray-400 text-sm">
            <i class="fa-solid fa-spinner animate-spin text-2xl text-mc-emerald mb-2"></i>
            <p>Đang tải dữ liệu từ bộ nhớ...</p>
        </div>
    </main>

    <!-- UPLOAD MODAL -->
    <div id="uploadModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-obsidian-900/90 backdrop-blur-md">
        <div class="glass-panel w-full max-w-xl rounded-2xl p-6 relative border border-gray-700">
            <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            
            <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-upload text-mc-emerald mr-2"></i>Đăng Addon / Mod Mới từ Điện thoại</h3>

            <form id="uploadForm" onsubmit="handleUploadSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Tên Addon / Mod *</label>
                        <input type="text" id="up-title" required class="w-full bg-obsidian-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-mc-emerald">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Tác giả *</label>
                        <input type="text" id="up-author" required class="w-full bg-obsidian-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-mc-emerald">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Phiên bản *</label>
                        <input type="text" id="up-version" required placeholder="1.21.x" class="w-full bg-obsidian-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-mc-emerald">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Loại *</label>
                        <select id="up-category" class="w-full bg-obsidian-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-mc-emerald">
                            <option value="Bedrock Addon">Bedrock Addon</option>
                            <option value="Java Mod">Java Mod</option>
                            <option value="Texture Pack">Texture Pack</option>
                        </select>
                    </div>
                </div>

                <!-- CHỌN TỆP TRỰC TIẾP -->
                <div class="p-4 rounded-xl bg-obsidian-800 border border-emerald-500/30 space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-mc-emerald mb-1"><i class="fa-solid fa-file-arrow-up mr-1"></i> 1. Chọn Tệp Addon/Mod (*.mcaddon, *.mcpack, *.zip, *.jar) *</label>
                        <input type="file" id="up-addon-file" required accept=".mcaddon,.mcpack,.zip,.jar" class="w-full text-xs text-gray-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-mc-emerald file:text-obsidian-900 hover:file:bg-emerald-400 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1"><i class="fa-solid fa-image mr-1"></i> 2. Chọn Ảnh bìa (Không bắt buộc)</label>
                        <input type="file" id="up-img-file" accept="image/*" class="w-full text-xs text-gray-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-gray-700 file:text-white cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">Mô tả ngắn *</label>
                    <textarea id="up-desc" rows="2" required class="w-full bg-obsidian-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-mc-emerald"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-2 rounded-xl bg-obsidian-700 text-xs text-gray-300">Hủy</button>
                    <button type="submit" id="btn-submit" class="px-5 py-2 rounded-xl bg-mc-emerald text-obsidian-900 font-bold text-xs shadow-lg flex items-center gap-2">
                        <span>Lưu Tệp & Đăng Bài</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        const DB_NAME = 'CraftVault_DB_v2';
        const DB_VERSION = 1;
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('addons')) {
                        db.createObjectStore('addons', { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e);
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            loadAddons();
        });

        async function loadAddons() {
            const tx = db.transaction('addons', 'readonly');
            const store = tx.objectStore('addons');
            const request = store.getAll();

            request.onsuccess = () => {
                const addons = request.result || [];
                document.getElementById('loading-state').classList.add('hidden');
                renderGrid(addons);
            };
        }

        function renderGrid(list) {
            const grid = document.getElementById('mods-grid');
            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 glass-panel rounded-2xl">
                        <i class="fa-solid fa-folder-open text-3xl text-gray-500 mb-2"></i>
                        <p class="text-xs text-gray-400">Chưa có tệp nào. Hãy ấn nút "Tải Lên Mod / Addon" để chọn tệp từ máy!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map(item => `
                <div class="glass-card rounded-2xl p-4 flex flex-col justify-between">
                    <div>
                        <div class="h-36 rounded-xl overflow-hidden mb-3 bg-obsidian-900 border border-gray-800">
                            <img src="${item.image}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex items-center justify-between text-[11px] text-gray-400 mb-1">
                            <span><i class="fa-solid fa-user text-mc-diamond mr-1"></i>${item.author}</span>
                            <span class="text-mc-emerald font-semibold">${item.version}</span>
                        </div>
                        <h3 class="font-bold text-base text-white mb-1">${item.title}</h3>
                        <p class="text-xs text-gray-400 line-clamp-2 mb-4">${item.desc}</p>
                    </div>
                    <div class="pt-3 border-t border-gray-800 flex items-center justify-between">
                        <span class="text-[11px] text-emerald-400 font-mono truncate max-w-[150px]"><i class="fa-solid fa-file-code mr-1"></i>${item.fileName}</span>
                        <button onclick="downloadAddon('${item.id}')" class="px-3.5 py-1.5 rounded-lg bg-mc-emerald text-obsidian-900 font-bold text-xs hover:bg-emerald-400 shadow-md">
                            <i class="fa-solid fa-download mr-1"></i> Tải Tệp
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function handleUploadSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Đang lưu tệp...`;
            btn.disabled = true;

            try {
                const addonFileInput = document.getElementById('up-addon-file');
                const imgFileInput = document.getElementById('up-img-file');

                const addonFile = addonFileInput.files[0];
                if (!addonFile) throw new Error('Vui lòng chọn tệp');

                let imageUrl = 'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=600&q=80';
                if (imgFileInput.files && imgFileInput.files[0]) {
                    imageUrl = await fileToBlobUrl(imgFileInput.files[0]);
                }

                // Đọc nội dung tệp dưới dạng ArrayBuffer để giữ chuẩn định dạng binary
                const arrayBuffer = await addonFile.arrayBuffer();

                const newAddon = {
                    id: 'addon-' + Date.now(),
                    title: document.getElementById('up-title').value,
                    author: document.getElementById('up-author').value,
                    version: document.getElementById('up-version').value,
                    category: document.getElementById('up-category').value,
                    desc: document.getElementById('up-desc').value,
                    image: imageUrl,
                    fileBuffer: arrayBuffer,
                    fileName: addonFile.name
                };

                const tx = db.transaction('addons', 'readwrite');
                const store = tx.objectStore('addons');
                store.add(newAddon);

                tx.oncomplete = () => {
                    showToast('Đã lưu tệp thành công!');
                    closeUploadModal();
                    document.getElementById('uploadForm').reset();
                    loadAddons();
                };
            } catch (err) {
                showToast('Lỗi: ' + err.message);
            } finally {
                btn.innerHTML = `Lưu Tệp & Đăng Bài`;
                btn.disabled = false;
            }
        }

        // XỬ LÝ TẢI VỀ: KHÔNG BAO GIỜ BỊ ĐỔI ĐUÔI THÀNH .TXT
        function downloadAddon(id) {
            const tx = db.transaction('addons', 'readonly');
            const store = tx.objectStore('addons');
            const req = store.get(id);

            req.onsuccess = () => {
                const item = req.result;
                if (!item) return;

                // Tạo Blob với MIME Type ép trình duyệt giữ nguyên đuôi file
                const blob = new Blob([item.fileBuffer], { type: 'application/octet-stream' });
                const blobUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = item.fileName; // Giữ nguyên đúng đuôi .mcaddon / .mcpack / .zip gốc
                document.body.appendChild(a);
                a.click();

                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 1000);

                showToast(`Đang tải tệp: ${item.fileName}`);
            };
        }

        function fileToBlobUrl(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

        function clearDatabase() {
            if (confirm('Bạn có chắc muốn xóa sạch dữ liệu đã lưu không?')) {
                const tx = db.transaction('addons', 'readwrite');
                tx.objectStore('addons').clear();
                tx.oncomplete = () => {
                    showToast('Đã xóa bộ nhớ!');
                    loadAddons();
                };
            }
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'glass-panel px-4 py-2.5 rounded-xl text-xs text-white border border-mc-emerald shadow-2xl flex items-center gap-2';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-mc-emerald"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
