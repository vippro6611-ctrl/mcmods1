<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Addon & Mod Vault - Full Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FIREBASE SDK (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .mc-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .mc-card:hover { transform: translateY(-4px); border-color: #10b981; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <nav class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="filterCategory('all')">
                <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-slate-900 font-extrabold text-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-tight tracking-wide bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">CRAFT VAULT</h1>
                    <p class="text-xs text-slate-400 font-medium">Kho Minecraft PE & Bedrock Sync Cloud</p>
                </div>
            </div>

            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Tìm kiếm Addon, Mod..." class="w-full bg-slate-800 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 border border-slate-700 text-slate-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-400" id="syncDot"></span>
                    <span id="syncText">Đang nối Firebase...</span>
                </div>
                <div id="authNavButtons" class="flex items-center gap-2"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 lg:px-8 py-8 flex-1 w-full">
        <div class="relative rounded-2xl p-6 sm:p-10 mb-8 overflow-hidden bg-gradient-to-r from-emerald-900/60 via-slate-900 to-slate-900 border border-emerald-500/20">
            <div class="relative z-10 max-w-2xl">
                <span class="inline-block px-3 py-1 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold rounded-full mb-3">
                    <i class="fa-solid fa-bolt mr-1"></i> Đồng Bộ Đa Thiết Bị Qua Firebase
                </span>
                <h2 class="text-2xl sm:text-4xl font-extrabold text-white mb-3">Kho Addon & Mod Trực Tuyến</h2>
                <div class="flex flex-wrap gap-3 mt-4">
                    <button onclick="openUploadModal()" class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl shadow-lg transition flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Đăng Addon Mới
                    </button>
                    <button onclick="showMyUploads()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-700 transition flex items-center gap-2">
                        <i class="fa-solid fa-folder-open"></i> Bài Của Tôi
                    </button>
                </div>
            </div>
        </div>

        <!-- CATEGORIES -->
        <div class="flex items-center justify-between gap-4 mb-6 overflow-x-auto pb-2" id="categoryTabs">
            <div class="flex items-center gap-2">
                <button onclick="filterCategory('all')" data-cat="all" class="cat-btn px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500 text-slate-950 transition">Tất cả</button>
                <button onclick="filterCategory('addon')" data-cat="addon" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300">Addon</button>
                <button onclick="filterCategory('mod')" data-cat="mod" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300">Mod</button>
                <button onclick="filterCategory('texture')" data-cat="texture" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300">Texture</button>
                <button onclick="filterCategory('world')" data-cat="world" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300">Bản đồ</button>
            </div>
        </div>

        <div id="addonGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        <div id="emptyState" class="hidden text-center py-16 bg-slate-900/50 rounded-2xl border border-dashed border-slate-800">
            <p class="text-sm text-slate-500">Chưa có dữ liệu bài đăng nào trên Đám Mây.</p>
        </div>
    </main>

    <!-- MODAL AUTH -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full relative">
            <button onclick="closeModal('authModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <div class="flex border-b border-slate-800 mb-6">
                <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-bold border-b-2 border-emerald-500 text-emerald-400">Đăng Nhập</button>
                <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-semibold text-slate-400">Đăng Ký</button>
            </div>
            <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
                <div><label class="block text-xs mb-1 text-slate-400">Email</label><input type="email" id="loginEmail" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></div>
                <div><label class="block text-xs mb-1 text-slate-400">Mật khẩu</label><input type="password" id="loginPassword" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></div>
                <button type="submit" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition">Đăng Nhập</button>
            </form>
            <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div><label class="block text-xs mb-1 text-slate-400">Tên hiển thị</label><input type="text" id="regName" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></div>
                <div><label class="block text-xs mb-1 text-slate-400">Email</label><input type="email" id="regEmail" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></div>
                <div><label class="block text-xs mb-1 text-slate-400">Mật khẩu</label><input type="password" id="regPassword" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></div>
                <button type="submit" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition">Tạo Tài Khoản Mới</button>
            </form>
        </div>
    </div>

    <!-- MODAL UPLOAD -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-lg w-full relative">
            <button onclick="closeModal('uploadModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-lg font-bold mb-4 text-white">Đăng Bài Mới Lên Đám Mây</h3>
            <form onsubmit="handleUpload(event)" class="space-y-4">
                <div><label class="block text-xs mb-1 text-slate-400">Tên Addon / Mod</label><input type="text" id="upTitle" placeholder="Ví dụ: Realistic Shaders" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">Danh mục</label>
                        <select id="upCategory" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="addon">Addon</option>
                            <option value="mod">Mod</option>
                            <option value="texture">Texture</option>
                            <option value="world">World</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-slate-400">Phiên bản MC</label>
                        <input type="text" id="upVersion" placeholder="1.20+" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div><label class="block text-xs mb-1 text-slate-400">Mô tả chi tiết</label><textarea id="upDescription" placeholder="Mô tả tính năng, cách cài đặt..." required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 h-24"></textarea></div>
                <div><label class="block text-xs mb-1 text-slate-400">Link tải (Google Drive / Mediafire)</label><input type="url" id="upAddonUrl" placeholder="https://..." required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></div>
                <button type="submit" id="btnUpload" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition">Đăng Ngay</button>
            </form>
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ AN TOÀN TRÁNH TREO NÚT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuiMF2yOtAscm9tW_JVkOtHWN0arQe6Qs",
            authDomain: "code1-a7090.firebaseapp.com",
            databaseURL: "https://code1-a7090-default-rtdb.firebaseio.com",
            projectId: "code1-a7090",
            storageBucket: "code1-a7090.firebasestorage.app",
            messagingSenderId: "251969618484",
            appId: "1:251969618484:web:45295451a8c485e81f4061",
            measurementId: "G-J8S7Q93561"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let addonsList = [];
        let activeCategory = 'all';
        let searchQuery = '';
        let isMyUploadsView = false;

        auth.onAuthStateChanged(user => {
            currentUser = user;
            renderAuthNav();
            renderAddons();
        });

        db.ref('addons').on('value', snapshot => {
            const data = snapshot.val();
            addonsList = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    addonsList.unshift({ id: key, ...data[key] });
                });
            }
            document.getElementById('syncDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
            document.getElementById('syncText').textContent = 'Đồng bộ Cloud';
            renderAddons();
        }, err => {
            document.getElementById('syncDot').className = 'w-2 h-2 rounded-full bg-rose-500';
            document.getElementById('syncText').textContent = 'Lỗi kết nối Firebase';
        });

        function renderAuthNav() {
            const nav = document.getElementById('authNavButtons');
            if (currentUser) {
                nav.innerHTML = `
                    <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl">
                        <i class="fa-solid fa-user text-emerald-400"></i>
                        <span class="text-xs font-bold text-white">${currentUser.displayName || currentUser.email.split('@')[0]}</span>
                        <button onclick="auth.signOut()" class="text-slate-400 hover:text-rose-400 ml-1" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>`;
            } else {
                nav.innerHTML = `
                    <button onclick="openAuthModal('login')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold transition">Đăng Nhập</button>
                    <button onclick="openAuthModal('register')" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 rounded-xl text-xs font-bold transition">Đăng Ký</button>`;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;
            const name = document.getElementById('regName').value;
            try {
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                await res.user.updateProfile({ displayName: name });
                closeModal('authModal');
            } catch(err) { alert("Lỗi đăng ký: " + err.message); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                closeModal('authModal');
            } catch(err) { alert("Lỗi đăng nhập: " + err.message); }
        }

        async function handleUpload(e) {
            e.preventDefault();
            if(!currentUser) return alert('Vui lòng đăng nhập trước khi đăng bài!');

            const btn = document.getElementById('btnUpload');
            btn.disabled = true; 
            btn.textContent = 'Đang đẩy lên Cloud...';

            try {
                const newAddon = {
                    userId: currentUser.uid,
                    author: currentUser.displayName || currentUser.email.split('@')[0],
                    title: document.getElementById('upTitle').value,
                    category: document.getElementById('upCategory').value,
                    version: document.getElementById('upVersion').value,
                    description: document.getElementById('upDescription').value,
                    fileUrl: document.getElementById('upAddonUrl').value,
                    image: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=600&q=80',
                    createdAt: Date.now()
                };

                await db.ref('addons').push(newAddon);
                closeModal('uploadModal');
                e.target.reset();
            } catch(err) {
                alert("Lỗi kết nối Firebase (Hãy kiểm tra lại Rules Realtime Database): " + err.message);
            } finally {
                btn.disabled = false; 
                btn.textContent = 'Đăng Ngay';
            }
        }

        function deleteAddon(id) {
            if(confirm('Bạn có chắc chắn muốn xóa bài đăng này khỏi hệ thống không?')) {
                db.ref('addons/' + id).remove();
            }
        }

        function renderAddons() {
            const grid = document.getElementById('addonGrid');
            let list = addonsList;

            if (isMyUploadsView) {
                list = list.filter(a => a.userId === currentUser?.uid);
            } else if (activeCategory !== 'all') {
                list = list.filter(a => a.category === activeCategory);
            }

            if (searchQuery) {
                list = list.filter(a => a.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            if (list.length === 0) {
                grid.innerHTML = '';
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');

            grid.innerHTML = list.map(item => `
                <div class="mc-card rounded-2xl p-4 flex flex-col justify-between">
                    <div>
                        <img src="${item.image}" class="w-full h-36 object-cover rounded-xl mb-3" alt="Thumbnail">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded border border-emerald-500/30">${item.category.toUpperCase()}</span>
                            <span class="text-[10px] text-slate-400">Ver ${item.version}</span>
                        </div>
                        <h4 class="font-bold text-white text-base mt-1 line-clamp-1">${item.title}</h4>
                        <p class="text-xs text-slate-400 mb-2">Bởi ${item.author || 'Thành viên'}</p>
                        <p class="text-xs text-slate-300 line-clamp-2 mb-3">${item.description}</p>
                    </div>
                    <div class="flex items-center gap-2 pt-2 border-t border-slate-800/80">
                        <a href="${item.fileUrl}" target="_blank" class="flex-1 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-center rounded-xl text-xs transition">Mở Link Tải</a>
                        ${currentUser && currentUser.uid === item.userId ? `<button onclick="deleteAddon('${item.id}')" class="px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl text-xs transition" title="Xóa bài"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderAddons();
        }

        function openAuthModal(t) { switchAuthTab(t); openModal('authModal'); }
        
        function openUploadModal() { 
            if(!currentUser) return openAuthModal('login'); 
            openModal('uploadModal'); 
            setTimeout(() => {
                document.getElementById('upTitle').focus();
            }, 150);
        }

        function showMyUploads() { 
            if(!currentUser) return openAuthModal('login');
            isMyUploadsView = true; 
            renderAddons(); 
        }

        function filterCategory(c) { 
            isMyUploadsView = false; 
            activeCategory = c; 
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.dataset.cat === c) {
                    btn.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500 text-slate-950 transition';
                } else {
                    btn.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 transition';
                }
            });
            renderAddons(); 
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        
        function switchAuthTab(t) {
            document.getElementById('tabLogin').className = t === 'login' ? 'flex-1 py-2 text-sm font-bold border-b-2 border-emerald-500 text-emerald-400' : 'flex-1 py-2 text-sm font-semibold text-slate-400';
            document.getElementById('tabRegister').className = t === 'register' ? 'flex-1 py-2 text-sm font-bold border-b-2 border-emerald-500 text-emerald-400' : 'flex-1 py-2 text-sm font-semibold text-slate-400';
            document.getElementById('formLogin').classList.toggle('hidden', t !== 'login');
            document.getElementById('formRegister').classList.toggle('hidden', t !== 'register');
        }
    </script>
</body>
</html>
